version: 2
updates:
  - package-ecosystem: npm
    directory: /backtesting-platform
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backtesting-platform-deps:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /hyperview-web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      hyperview-web-deps:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: cargo
    directory: /backtesting-platform/packages/hypescript
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      hypescript-deps:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        update-types: [minor, patch]
