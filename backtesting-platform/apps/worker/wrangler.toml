name = "backtest-worker"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Production route binds api.getdebanked.xyz to this worker.
routes = [
  { pattern = "api.getdebanked.xyz/*", zone_name = "getdebanked.xyz" },
]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "backtest"
database_id = "REPLACE_ME_AFTER_wrangler_d1_create"
migrations_dir = "../../infra/d1/migrations"

[[r2_buckets]]
binding = "DATA"
bucket_name = "backtest-data"

[[queues.producers]]
binding = "Q"
queue = "backtest-jobs"

[[queues.consumers]]
queue = "backtest-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3

# 60 requests/min/IP across all routes.
[[unsafe.bindings]]
name = "RL_GLOBAL"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# 10 POST /runs/min/IP. Run-creation is the expensive path; tighten it harder.
[[unsafe.bindings]]
name = "RL_RUNS"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[vars]
ALLOWED_ORIGINS = "https://getdebanked.xyz"
# OPERATOR_EMAILS = "you@example.com" — set per-env, comma-separated. Required
# alongside the Cloudflare Access policy on getdebanked.xyz.

# Secrets set via `wrangler secret put`:
#   KALSHI_API_KEY_ID
#   KALSHI_PRIVATE_KEY_PEM
#   CFBENCHMARKS_TOKEN
#   WORKER_INTERNAL_SECRET
